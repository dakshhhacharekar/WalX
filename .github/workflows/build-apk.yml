name: Build & Release WalX APK

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: "Optional version label (e.g. v1.0.0). Leave blank to auto-number."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Publish WalX Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare matching debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble signed WalX Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK and prepare release metadata
        id: release_meta
        env:
          VERSION_INPUT: ${{ inputs.version_label }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_SRC" ]; then
            echo "Error: Expected debug APK not found or empty at $APK_SRC" >&2
            exit 1
          fi

          cp "$APK_SRC" WalX-debug.apk

          CLEAN_TAG=$(printf '%s' "$VERSION_INPUT" | tr -cd 'A-Za-z0-9._-')
          if [ -z "$CLEAN_TAG" ]; then
            CLEAN_TAG="v1.0-build-${RUN_NUMBER}"
          fi

          if gh release view "$CLEAN_TAG" >/dev/null 2>&1; then
            CLEAN_TAG="${CLEAN_TAG}-${RUN_NUMBER}"
          fi

          echo "tag=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          RELEASE_URL=$(gh release create "$RELEASE_TAG" WalX-debug.apk \
            --title "WalX Android APK (${RELEASE_TAG})" \
            --notes "Ready-to-install signed WalX debug APK (built from commit ${GITHUB_SHA::7}). Tap **WalX-debug.apk** below to download directly onto your Android phone—no unzipping required.")

          {
            echo "### WalX APK Published Successfully"
            echo ""
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **Direct Download Page:** ${RELEASE_URL}"
            echo ""
            echo "Open the link above on your Android phone and tap **WalX-debug.apk** to download and install."
          } >> "$GITHUB_STEP_SUMMARY"
